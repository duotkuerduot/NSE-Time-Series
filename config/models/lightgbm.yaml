# LightGBM. The frozen values below were fixed before any result was seen.
label: "LightGBM"
# Values tuned on the tuning period only (2013 to 2017, 40 Optuna trials, `nsefc dev tune`).
# They are not active: with them, LightGBM's directional calls on the holdout come within 0.2
# percentage points of the plausibility tripwire, and the champion is the same
# (docs/decisions.md). To use them, replace the `frozen:` block below.
# frozen:
#   objective: l1
#   learning_rate: 0.03229
#   num_leaves: 33
#   min_data_in_leaf: 1769
#   feature_fraction: 0.8312
#   bagging_fraction: 0.7762
#   bagging_freq: 1
#   lambda_l2: 6.623
#   n_estimators: 1000
#   early_stopping_rounds: 50
frozen:
  objective: l1
  learning_rate: 0.03
  num_leaves: 15
  min_data_in_leaf: 500
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  n_estimators: 1000
  early_stopping_rounds: 50
search:
  objective: {choices: [l1, huber]}
  learning_rate: {low: 0.01, high: 0.1, log: true}
  num_leaves: {low: 7, high: 63, integer: true}
  min_data_in_leaf: {low: 100, high: 2000, integer: true}
  feature_fraction: {low: 0.5, high: 0.95}
  bagging_fraction: {low: 0.5, high: 0.95}
  lambda_l2: {low: 0.0, high: 10.0}
