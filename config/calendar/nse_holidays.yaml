# NSE trading calendar: source of truth for which weekdays are sessions (ENGINEERING.md 7.5).
#
# Status values
#   rule         fixed-date or Easter-based statutory holiday
#   confirmed    NSE trading data shows no trading that day (repository "NSE Data", 2007-2025)
#   listed       on published 2024-2026 holiday lists, not yet checked against trading data
#   provisional  expected but not yet gazetted (moon-dependent) or not verifiable (no data)
#
# Every change goes through a reviewed pull request. Weekday gaps in the trading data that
# no entry explains are listed in reports/calendar-reconciliation.md for the Phase 1 audit;
# they are deliberately NOT entered here until someone finds the reason.
version: 1
timezone: Africa/Nairobi
coverage:
  start: 2005-01-01
  end: 2026-12-31   # extend with next year's moon-dependent dates before December

# A holiday falling on a Sunday is observed on the next weekday that is not itself a holiday.
# Confirmed in the data: Christmas on Sunday 2016-12-25 and 2022-12-25 closed both the 26th
# and the 27th; Boxing Day on Sunday 2021-12-26 closed Monday the 27th. Saturdays do not move.
# December 2010 and 2011 are exceptions: the market traded (see held_sessions below).
sunday_rule: next_free_weekday

fixed:
  - {name: "New Year's Day", month: 1, day: 1}
  - {name: Labour Day, month: 5, day: 1}
  - {name: Madaraka Day, month: 6, day: 1}
  - {name: Moi Day, month: 10, day: 10, until: 2009,
     source: "NSE data: no trading 2007-10-10 and 2008-10-10"}
  - {name: Moi Day, month: 10, day: 10, since: 2018, until: 2019,
     source: "NSE data: no trading 2018-10-10 and 2019-10-10; not observed 2010-2017"}
  - {name: Utamaduni Day, month: 10, day: 10, since: 2020, until: 2023,
     source: "NSE data: no trading 2021-10-11 (Sunday rule), 2022-10-10, 2023-10-10; name approximate"}
  - {name: Mazingira Day, month: 10, day: 10, since: 2024,
     source: "NSE data 2024-10-10, 2025-10-10; officeholidays.com 2024-2026"}
  - {name: Kenyatta Day, month: 10, day: 20, until: 2009}
  - {name: Mashujaa Day, month: 10, day: 20, since: 2010}
  - {name: Jamhuri Day, month: 12, day: 12}
  - {name: Christmas Day, month: 12, day: 25}
  - {name: Boxing Day, month: 12, day: 26}

easter:
  - {name: Good Friday, offset_days: -2}
  - {name: Easter Monday, offset_days: 1}

# Moon-dependent holidays, recorded on the weekday the market was (or will be) closed.
dated:
  - {date: 2005-11-03, name: Idd-ul-Fitr, status: provisional, source: "approximate; no trading data before 2007"}
  - {date: 2006-10-24, name: Idd-ul-Fitr, status: provisional, source: "approximate; no trading data before 2007"}
  - {date: 2008-10-01, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
