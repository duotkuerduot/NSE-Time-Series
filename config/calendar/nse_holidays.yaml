  - {date: 2022-07-11, name: Idd-ul-Azha, status: confirmed, source: "NSE data; Idd fell on Sunday 10 Jul"}
  - {date: 2023-06-28, name: Idd-ul-Azha, status: confirmed, source: "NSE data"}
