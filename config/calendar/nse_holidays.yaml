# Weekdays the rules above would close but on which the market traded: for history the data
# wins (ENGINEERING.md 7.5). Each was a full session (about 57 to 59 securities quoted and
# 36 to 42 traded, like the days around it).
held_sessions:
  - {date: 2010-12-27, status: confirmed, source: "NSE data: Boxing Day on Sunday 26 Dec 2010 was not moved to Monday"}
  - {date: 2011-12-27, status: confirmed, source: "NSE data: Christmas on Sunday 25 Dec 2011 did not cascade past Boxing Day (Monday 26)"}
