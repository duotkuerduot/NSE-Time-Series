  - {date: 2026-03-20, name: Idd-ul-Fitr, status: listed, source: "officeholidays.com 2026"}
  - {date: 2016-09-12, name: Idd-ul-Azha, status: confirmed, source: "NSE data"}
  - {date: 2018-08-21, name: Idd-ul-Azha, status: confirmed, source: "NSE data"}
  - {date: 2019-08-12, name: Idd-ul-Azha, status: confirmed, source: "NSE data"}
