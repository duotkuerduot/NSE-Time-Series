  - {date: 2011-08-31, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2012-08-20, name: Idd-ul-Fitr, status: confirmed, source: "NSE data; Idd fell on Sunday 19 Aug"}
  - {date: 2013-08-09, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2014-07-29, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2016-07-07, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2017-06-26, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2018-06-15, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2019-06-05, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2020-05-25, name: Idd-ul-Fitr, status: confirmed, source: "NSE data; Idd fell on Sunday 24 May"}
  - {date: 2021-05-14, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2022-05-03, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
  - {date: 2023-04-21, name: Idd-ul-Fitr, status: confirmed, source: "NSE data"}
