# Tests only: no secrets, no data downloads, no schedules. Every
# third-party action is pinned to a commit SHA (tests/unit/test_repository.py checks this).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (mypy, strict)
        run: uv run mypy
      - name: Module boundaries (import-linter)
        run: uv run lint-imports
      - name: API contract is current and the fixtures are valid
        run: |
          uv run nsefc dev contract --check
          uv run nsefc dev contract --validate contracts/api/v1/fixtures
      - name: The committed web build matches its sources
        run: uv run nsefc dev web-hash --check
      - name: Tests (unit, property, leakage, integration)
        run: uv run pytest
      - name: Known vulnerabilities in locked dependencies (pip-audit)
        run: |
          uv export --frozen --no-emit-project --all-extras --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes

  e2e-sample:
    # The one-command run on every operating system people clone onto (Windows matters most).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: uv run nsefc run --sample --no-serve
        run: uv run nsefc run --sample --no-serve
      - name: The published files exist and validate
        run: uv run nsefc dev contract --validate data/api/v1
      - name: A repeat run reuses every stage
        run: uv run nsefc run --sample --no-serve

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the contract
        run: pnpm check:types
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, page and language-rule (banned-word) tests
        run: pnpm test
      - run: pnpm build
      - name: The committed build is current
        run: |
          git diff --exit-code -- ../src/nsefc/web_dist/.source-hash || {
            echo "run \`pnpm -C web build\` and commit src/nsefc/web_dist"; exit 1; }
      - name: Bundle budget
        run: pnpm check:size
      - name: Known vulnerabilities (pnpm audit)
        run: pnpm audit --audit-level high

  browser:
    # Sample run, the local server, then Playwright with axe against it, plus the
    # fixture smoke test.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv run nsefc run --sample --no-serve
      - name: Start the local server
        run: |
          nohup uv run nsefc serve --no-browser --port 8765 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/v1/status.json > /dev/null && break; sleep 1; done
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps chromium
      - name: End to end against nsefc serve (Playwright + axe)
        run: pnpm -C web e2e
        env:
          NSEFC_E2E_URL: http://127.0.0.1:8765
      - name: Smoke test against the contract fixtures (Playwright + axe)
        run: pnpm -C web e2e
