type = "forbidden"
source_modules = ["nsefc.ingestion"]
forbidden_modules = [
    "nsefc.features", "nsefc.targets", "nsefc.models", "nsefc.intervals", "nsefc.training",
    "nsefc.evaluation", "nsefc.selection", "nsefc.registry", "nsefc.prediction",
    "nsefc.monitoring", "nsefc.api", "nsefc.publishing", "nsefc.pipeline", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "features cannot see targets or models (leakage rule L2)"
type = "forbidden"
source_modules = ["nsefc.features"]
forbidden_modules = [
    "nsefc.targets", "nsefc.models", "nsefc.intervals", "nsefc.training", "nsefc.evaluation",
    "nsefc.selection", "nsefc.registry", "nsefc.prediction", "nsefc.monitoring",
    "nsefc.publishing", "nsefc.ingestion", "nsefc.quality", "nsefc.pipeline", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "targets depend only on domain, calendar and reference"
type = "forbidden"
source_modules = ["nsefc.targets"]
forbidden_modules = [
    "nsefc.storage", "nsefc.quality", "nsefc.ingestion", "nsefc.features", "nsefc.models",
    "nsefc.intervals", "nsefc.training", "nsefc.evaluation", "nsefc.selection",
    "nsefc.registry", "nsefc.prediction", "nsefc.monitoring", "nsefc.api",
