[project]
name = "nsefc"
version = "2.0.0"
description = "NSE Forecast: next-session forecasts for Nairobi Securities Exchange shares, tested against a no-change guess and run locally with one command"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Duot Kuer" }]
keywords = [
    "nairobi-securities-exchange", "nse", "kenya", "stock-market", "forecasting",
    "time-series", "walk-forward-validation", "conformal-prediction", "lightgbm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "joblib>=1.4",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "pandas>=3.0",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.optional-dependencies]
# `uv run --extra full nsefc run --profile full`: hyperparameter tuning and CatBoost.
full = ["catboost>=1.2.7", "optuna>=4.0"]

[project.urls]
Homepage = "https://github.com/duotkuerduot/NSE-Time-Series"
Documentation = "https://github.com/duotkuerduot/NSE-Time-Series/tree/main/docs"
Issues = "https://github.com/duotkuerduot/NSE-Time-Series/issues"
Source = "https://github.com/duotkuerduot/NSE-Time-Series"

[project.scripts]
nsefc = "nsefc.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsefc"]
# The prebuilt frontend ships inside the package, including web_dist/.source-hash.
artifacts = ["src/nsefc/web_dist/**"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["web", "data", "src/nsefc/web_dist", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PT", "N", "C4", "PIE"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # en dashes, minus signs and section signs are intentional
    "N803", "N806",                # X, y and C_T follow the maths in docs/methodology.md
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "DTZ005", "PT018", "E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "sklearn", "sklearn.*", "lightgbm", "lightgbm.*", "catboost", "catboost.*",
    "optuna", "optuna.*", "joblib", "joblib.*", "scipy", "scipy.*", "pyarrow", "pyarrow.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:X does not have valid feature names:UserWarning",
]

# ---------------------------------------------------------------- import-linter
# Module boundaries. The one that matters most for honest results: features may not import
# targets (leakage rule L2). The ML layer never touches acquisition, publishing or serving.
[tool.importlinter]
root_package = "nsefc"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "domain is pure: it imports nothing else from nsefc"
type = "forbidden"
source_modules = ["nsefc.domain"]
forbidden_modules = [
    "nsefc.calendar", "nsefc.config", "nsefc.storage", "nsefc.acquire", "nsefc.sample",
    "nsefc.ingest", "nsefc.quality", "nsefc.features", "nsefc.targets", "nsefc.models",
    "nsefc.intervals", "nsefc.evaluation", "nsefc.selection", "nsefc.prediction", "nsefc.api",
    "nsefc.publishing", "nsefc.serve", "nsefc.pipeline", "nsefc.devtools", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "calendar depends only on domain"
type = "forbidden"
source_modules = ["nsefc.calendar"]
forbidden_modules = [
    "nsefc.config", "nsefc.storage", "nsefc.acquire", "nsefc.sample", "nsefc.ingest",
    "nsefc.quality", "nsefc.features", "nsefc.targets", "nsefc.models", "nsefc.intervals",
    "nsefc.evaluation", "nsefc.selection", "nsefc.prediction", "nsefc.api", "nsefc.publishing",
    "nsefc.serve", "nsefc.pipeline", "nsefc.devtools", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "config and storage are leaves: no business modules"
type = "forbidden"
source_modules = ["nsefc.config", "nsefc.storage"]
forbidden_modules = [
    "nsefc.calendar", "nsefc.acquire", "nsefc.sample", "nsefc.ingest", "nsefc.quality",
    "nsefc.features", "nsefc.targets", "nsefc.models", "nsefc.intervals", "nsefc.evaluation",
    "nsefc.selection", "nsefc.prediction", "nsefc.api", "nsefc.publishing", "nsefc.serve",
    "nsefc.pipeline", "nsefc.devtools", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "the API contract depends only on domain"
type = "forbidden"
source_modules = ["nsefc.api"]
forbidden_modules = [
    "nsefc.calendar", "nsefc.config", "nsefc.storage", "nsefc.acquire", "nsefc.sample",
    "nsefc.ingest", "nsefc.quality", "nsefc.features", "nsefc.targets", "nsefc.models",
    "nsefc.intervals", "nsefc.evaluation", "nsefc.selection", "nsefc.prediction",
    "nsefc.publishing", "nsefc.serve", "nsefc.pipeline", "nsefc.devtools", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "acquisition, the sample generator and ingestion never touch ML or publishing"
type = "forbidden"
source_modules = ["nsefc.acquire", "nsefc.sample", "nsefc.ingest", "nsefc.quality"]
forbidden_modules = [
    "nsefc.features", "nsefc.targets", "nsefc.models", "nsefc.intervals", "nsefc.evaluation",
    "nsefc.selection", "nsefc.prediction", "nsefc.publishing", "nsefc.serve", "nsefc.pipeline",
    "nsefc.devtools", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "features cannot see targets, models or results (leakage rule L2)"
type = "forbidden"
source_modules = ["nsefc.features"]
forbidden_modules = [
    "nsefc.targets", "nsefc.models", "nsefc.intervals", "nsefc.evaluation", "nsefc.selection",
    "nsefc.prediction", "nsefc.acquire", "nsefc.ingest", "nsefc.publishing", "nsefc.serve",
    "nsefc.pipeline", "nsefc.devtools", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "targets depend only on domain and calendar"
type = "forbidden"
source_modules = ["nsefc.targets"]
forbidden_modules = [
    "nsefc.features", "nsefc.models", "nsefc.intervals", "nsefc.evaluation", "nsefc.selection",
    "nsefc.prediction", "nsefc.acquire", "nsefc.ingest", "nsefc.publishing", "nsefc.serve",
    "nsefc.pipeline", "nsefc.devtools", "nsefc.cli", "nsefc.storage",
]

[[tool.importlinter.contracts]]
name = "models and intervals are pure estimators"
type = "forbidden"
source_modules = ["nsefc.models", "nsefc.intervals"]
forbidden_modules = [
    "nsefc.calendar", "nsefc.acquire", "nsefc.sample", "nsefc.ingest", "nsefc.quality",
    "nsefc.features", "nsefc.targets", "nsefc.evaluation", "nsefc.selection", "nsefc.prediction",
    "nsefc.api", "nsefc.publishing", "nsefc.serve", "nsefc.pipeline", "nsefc.devtools",
    "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "evaluation, selection and prediction never touch acquisition or publishing"
type = "forbidden"
source_modules = ["nsefc.evaluation", "nsefc.selection", "nsefc.prediction"]
forbidden_modules = [
    "nsefc.acquire", "nsefc.ingest", "nsefc.publishing", "nsefc.serve", "nsefc.pipeline",
    "nsefc.devtools", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "publishing and the server never import the ML layer"
type = "forbidden"
source_modules = ["nsefc.publishing", "nsefc.serve"]
forbidden_modules = [
    "nsefc.features", "nsefc.targets", "nsefc.models", "nsefc.intervals", "nsefc.evaluation",
    "nsefc.selection", "nsefc.prediction", "nsefc.acquire", "nsefc.ingest", "nsefc.pipeline",
    "nsefc.devtools", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "only the CLI imports the pipeline; nothing imports the CLI"
type = "forbidden"
source_modules = [
    "nsefc.domain", "nsefc.calendar", "nsefc.config", "nsefc.storage", "nsefc.acquire",
    "nsefc.sample", "nsefc.ingest", "nsefc.quality", "nsefc.features", "nsefc.targets",
    "nsefc.models", "nsefc.intervals", "nsefc.evaluation", "nsefc.selection",
    "nsefc.prediction", "nsefc.api", "nsefc.publishing", "nsefc.serve", "nsefc.devtools",
]
forbidden_modules = ["nsefc.pipeline", "nsefc.cli"]
