type = "forbidden"
source_modules = ["nsefc.models", "nsefc.intervals"]
forbidden_modules = [
    "nsefc.calendar", "nsefc.storage", "nsefc.reference", "nsefc.quality", "nsefc.ingestion",
    "nsefc.features", "nsefc.targets", "nsefc.training", "nsefc.evaluation",
    "nsefc.selection", "nsefc.registry", "nsefc.prediction", "nsefc.monitoring", "nsefc.api",
    "nsefc.publishing", "nsefc.pipeline", "nsefc.cli", "nsefc.config",
]

[[tool.importlinter.contracts]]
name = "training, evaluation and selection never touch ingestion or publishing"
type = "forbidden"
source_modules = ["nsefc.training", "nsefc.evaluation", "nsefc.selection"]
forbidden_modules = [
    "nsefc.ingestion", "nsefc.publishing", "nsefc.prediction", "nsefc.pipeline", "nsefc.cli",
]

[[tool.importlinter.contracts]]
name = "registry does not import training internals"
type = "forbidden"
source_modules = ["nsefc.registry"]
forbidden_modules = [
    "nsefc.training", "nsefc.evaluation", "nsefc.selection", "nsefc.ingestion",
