# Documented corrections to the source data (data/README.md lists the defects).
#
# Each rule fixes rows in exactly one file, identified by its SHA-256, so it never applies to
# a different dataset version: if a file changes, its rules stop matching and the check they
# were answering (DAT-01, KEY-01) reports the problem instead. `lines` are inclusive file line
# numbers, with the header as line 1.
#
# Evidence for each redate: the block sits between the right neighbours in the file, every
# row's "Previous" equals the prior session's close, and the next session's "Previous" equals
# the block's closes.
version: 1
corrections:
  # ---------------------------------------------------------------- NSE data, 2009 file
  - id: R2009-01
    file: NSE_data_all_stocks_2009.csv
    sha256: "ac9bdb30a7f7f5c5fe61b150bfa45fd6c8dbe48bd9461ff65a4510f6d1ba4ef1"
    action: redate
    from: "2009-01-29"
    to: "2009-01-21"
    lines: [540, 579]
    reason: >-
      A 40-row block dated 29 Jan 2009 sits between 20 and 22 Jan; 21 Jan has no other data
      and the real 29 Jan block appears later. Previous prices chain 20 Jan -> block -> 22 Jan.
  - id: R2009-02
    file: NSE_data_all_stocks_2009.csv
    sha256: "ac9bdb30a7f7f5c5fe61b150bfa45fd6c8dbe48bd9461ff65a4510f6d1ba4ef1"
    action: redate
    from: "2009-04-02"
    to: "2009-02-04"
    lines: [997, 1055]
    reason: >-
      Day and month swapped: a block dated 2 Apr 2009 sits between 3 and 5 Feb, and the prices
      chain 3 Feb -> block -> 5 Feb. The real 2 Apr block appears later.
  - id: R2009-03
    file: NSE_data_all_stocks_2009.csv
    sha256: "ac9bdb30a7f7f5c5fe61b150bfa45fd6c8dbe48bd9461ff65a4510f6d1ba4ef1"
    action: redate
    from: "2009-10-08"
    to: "2009-08-10"
    lines: [8606, 8664]
    reason: >-
      Day and month swapped: a block dated 8 Oct 2009 sits between 7 and 11 Aug, and the
      prices chain 7 Aug -> block -> 11 Aug. The real 8 Oct block appears later.

  # ---------------------------------------------------------------- NSE data, 2017 file
  - id: R2017-01
    file: NSE_data_all_stocks_2017.csv
    sha256: "1f4f1f6adceb8511566d81e6d6ea5f09dff764c2fbfd89ab2e7f6410d06a316e"
    action: redate
    from: "2015-05-09"
    to: "2017-05-09"
    lines: [6016, 6085]
    reason: >-
      Wrong year: a 70-row block dated Saturday 9 May 2015 sits between 8 and 10 May 2017, and
      the prices chain 8 May -> block -> 10 May 2017.

  # ---------------------------------------------------------------- synthetic sample
  # The sample generator plants this defect on purpose; tests/unit/test_sample.py fails if the
  # generated file's hash changes, so this rule is updated together with the generator.
  - id: SAMPLE-01
    file: NSE_data_all_stocks_2017.csv (sample)
    sha256: "2cb5149d1003535bc437adc1ac24f514316da43b88ae8342fdaaa78e8c67c131"
    action: redate
    from: "2017-06-10"
    to: "2017-06-13"
    lines: [2, 100000]
    reason: Planted defect in the synthetic sample; the 13 June block is dated Saturday 10 June.
